<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Анимированные полосы для маски -->
    <pattern id="movingLines" x="0" y="0" width="136" height="600" patternUnits="userSpaceOnUse">
      <rect width="68" height="600" fill="white"></rect>
      <animate attributeName="x" from="0" to="136" dur="2s" repeatCount="indefinite"></animate>
    </pattern>

    <mask id="myMask">
      <!-- Белый фон в маске означает "показывать всё" -->
      <rect width="100%" height="100%" fill="white" />
      
      <!-- Группа с кругами и наложением полос -->
      <g fill="none" stroke="black" stroke-width="34">
        <circle cx="300" cy="300" r="50"></circle>
        <circle cx="300" cy="300" r="120"></circle>
        <circle cx="300" cy="300" r="190"></circle>
        <circle cx="300" cy="300" r="260"></circle>
        <circle cx="300" cy="300" r="330"></circle>
      </g>
      
      <!-- Слой, который "вычитает" полосы из кругов внутри маски -->
      <g style="mix-blend-mode: difference;">
        <rect width="600" height="600" fill="url(#movingLines)"></rect>
      </g>
    </mask>
  </defs>

  <!-- Этот прямоугольник заполнит весь блок. 
       fill="currentColor" позволит менять цвет через CSS (color: ...) -->
  <rect width="100%" height="100%" fill="currentColor" mask="url(#myMask)" />
</svg>